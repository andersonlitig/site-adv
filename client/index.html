    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que fazer se meu benefício foi negado pelo INSS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Você tem 30 dias após tomar ciência da decisão para recorrer dentro do próprio INSS. Porém, se a negativa envolver perícia médica, atividade especial (PPP) ou provas que o INSS costuma rejeitar, também é possível ingressar diretamente na Justiça Federal sem perder os atrasados desde a data do primeiro pedido."
          }
        },
        {
          "@type": "Question",
          "name": "Vale a pena fazer Planejamento Previdenciário ou pedir direto no Meu INSS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O simulador gratuito do Meu INSS não corrige erros no CNIS, não converte tempo especial (PPP) nem compara se pagar pelo teto nos últimos anos compensa após a Reforma da Previdência. O planejamento previdenciário analisa todo o seu histórico antes do pedido para evitar perda permanente de valor ou escolha da regra errada."
          }
        },
        {
          "@type": "Question",
          "name": "Quem nunca pagou INSS ou tem deficiência tem direito a algum benefício?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O BPC/LOAS garante um salário mínimo por mês para idosos a partir de 65 anos e pessoas com deficiência de qualquer idade em situação de baixa renda familiar, sem exigir contribuições anteriores ao INSS. Despesas contínuas com medicamentos, fraldas e tratamentos podem ser consideradas na análise judicial da renda."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o prazo para pedir revisão de aposentadoria — e ela pode diminuir o valor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A regra geral é de até 10 anos a partir do primeiro pagamento recebido, com exceções para ações trabalhistas ou erros nunca avaliados pelo INSS. Como um pedido feito sem cálculo pode gerar reexame desfavorável, realizamos uma auditoria matemática prévia para conferir se existe aumento seguro antes de protocolar."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso ter todos os documentos em mãos antes de conversar no WhatsApp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. No primeiro contato basta explicar sua dúvida ou o que aconteceu no INSS. Se já tiver foto ou PDF do extrato CNIS, carteira de trabalho ou carta de negativa, melhor ainda — mas se não tiver, nossa equipe orienta exatamente como baixar tudo pelo celular."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o atendimento presencial na Serra/ES e 100% online?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nosso escritório fica na Serra/ES para quem prefere conversar pessoalmente com hora marcada. Para quem mora em outras cidades, estados ou no exterior, o atendimento é 100% digital pelo WhatsApp e videochamada, com envio de documentos por foto ou PDF e assinatura eletrônica pelo celular."
          }
        },
        {
          "@type": "Question",
          "name": "Como conferir o registro do advogado na OAB e a segurança do atendimento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Dr. Anderson Litig é advogado inscrito na OAB/ES sob o nº 40.152 e pós-graduado em Direito Previdenciário. A inscrição está ativa para consulta pública no Cadastro Nacional dos Advogados (CNA/CFOAB), e você também pode conferir nossas avaliações reais de clientes no Google."
          }
        }
