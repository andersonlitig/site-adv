            "text": "Sim — e é importante agir rápido. Existem dois caminhos: o recurso administrativo (dentro do próprio INSS) e a ação judicial. Na maioria dos casos, identificamos vícios no indeferimento que permitem reverter a decisão. Quanto antes você agir, melhores as chances e maior o período retroativo de benefício a receber."
